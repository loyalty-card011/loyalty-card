<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luxury Hotels - Loyalty Card</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f7f7f5;
  color:#222;
}

.container{
  width:100%;
  max-width:430px;
  margin:auto;
  padding:22px 16px 40px;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:700;
  margin-top:20px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin:8px 0 30px;
}

.box{
  background:white;
  border-radius:20px;
  padding:24px;
  box-shadow:0 8px 30px rgba(0,0,0,.07);
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:14px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#222;
  color:white;
}

.secondary{
  background:#eee;
  color:#222;
}

.hidden{
  display:none;
}

.greeting{
  margin-bottom:18px;
}

.greeting h2{
  margin:0;
}

.greeting p{
  color:#777;
  margin:6px 0 0;
}

.card{
  background:#202020;
  color:white;
  border-radius:22px;
  padding:24px;
  margin-top:18px;
}

.card-title{
  font-size:14px;
  opacity:.7;
}

.card-brand{
  font-size:23px;
  font-weight:700;
  margin-top:5px;
}

.stamps{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-top:25px;
}

.stamp{
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid #777;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  margin:auto;
}

.stamp.active{
  background:white;
  color:#222;
  border-color:white;
}

.progress-text{
  text-align:center;
  margin-top:18px;
  font-size:14px;
  opacity:.8;
}

.reward{
  background:#fff8df;
  border-radius:16px;
  padding:17px;
  margin-top:18px;
  color:#5b4900;
  text-align:center;
  font-weight:700;
}

.message{
  text-align:center;
  margin:15px 0;
  font-size:14px;
  min-height:20px;
}

.links{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.links a{
  flex:1;
  text-decoration:none;
  text-align:center;
  padding:13px 8px;
  border-radius:12px;
  background:#eee;
  color:#222;
  font-weight:600;
  font-size:14px;
}

.logout{
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginScreen">

    <div class="logo">Luxury Hotels</div>

    <div class="subtitle">
      Your Digital Loyalty Card
    </div>

    <div class="box">

      <input
        id="name"
        type="text"
        placeholder="Your Name"
        autocomplete="name"
      >

      <input
        id="mobile"
        type="tel"
        placeholder="10-digit Mobile Number"
        maxlength="10"
        inputmode="numeric"
      >

      <button class="primary" onclick="login()">
        Continue
      </button>

      <div id="loginMessage" class="message"></div>

    </div>

  </div>


  <!-- HOME -->
  <div id="homeScreen" class="hidden">

    <div class="greeting">

      <h2 id="welcomeName">Hello</h2>

      <p>
        Welcome to Luxury Hotels
      </p>

    </div>


    <div class="card">

      <div class="card-title">
        LOYALTY CARD
      </div>

      <div class="card-brand">
        Luxury Hotels
      </div>


      <div id="stamps" class="stamps"></div>


      <div id="progressText" class="progress-text">
        0 / 10 visits
      </div>

    </div>


    <div id="rewardBox" class="reward hidden">
      🎉 Reward unlocked!
    </div>


    <div id="visitMessage" class="message"></div>


    <button
      id="collectButton"
      class="primary"
      onclick="collectVisit()"
    >
      COLLECT VISIT
    </button>


    <div class="links">

      <a
        href="https://www.google.com"
        target="_blank"
      >
        ⭐ Google Review
      </a>

      <a
        href="https://www.instagram.com"
        target="_blank"
      >
        📷 Instagram
      </a>

    </div>


    <button
      class="secondary logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://rqjjcyxlfaxlwcrdwgoh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_FqhEVP3LB3sXyzFXpXeEag_Hh89baC6";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentCustomer = null;


/* LOGIN */

async function login(){

  const name =
    document.getElementById("name").value.trim();

  const mobile =
    document.getElementById("mobile").value.trim();

  const message =
    document.getElementById("loginMessage");


  message.textContent = "";


  if(!name){

    message.textContent =
      "Please enter your name.";

    return;
  }


  if(!/^[0-9]{10}$/.test(mobile)){

    message.textContent =
      "Please enter a valid 10-digit mobile number.";

    return;
  }


  message.textContent =
    "Loading...";


  const { data, error } =
    await supabaseClient.rpc(
      "get_customer",
      {
        p_name:name,
        p_mobile:mobile
      }
    );


  if(error){

    console.error(error);

    message.textContent =
      "Something went wrong. Please try again.";

    return;
  }


  currentCustomer = data;


  localStorage.setItem(
    "luxury_customer",
    JSON.stringify(currentCustomer)
  );


  showHome();

}


/* SHOW HOME */

function showHome(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("homeScreen")
    .classList.remove("hidden");


  document
    .getElementById("welcomeName")
    .textContent =
      "Hello, " + currentCustomer.name;


  updateCard();

}


/* UPDATE CARD */

function updateCard(){

  const stampsContainer =
    document.getElementById("stamps");

  stampsContainer.innerHTML = "";


  const stamps =
    Number(currentCustomer.stamps || 0);


  for(let i=1;i<=10;i++){

    const stamp =
      document.createElement("div");

    stamp.className = "stamp";


    if(i <= stamps){

      stamp.classList.add("active");

      stamp.textContent = "✓";

    }else{

      stamp.textContent = i;

    }


    stampsContainer.appendChild(stamp);

  }


  document
    .getElementById("progressText")
    .textContent =
      stamps + " / 10 visits";


  const rewardBox =
    document.getElementById("rewardBox");


  if(currentCustomer.reward_ready){

    rewardBox.classList.remove("hidden");

  }else{

    rewardBox.classList.add("hidden");

  }

}


/* COLLECT VISIT */

async function collectVisit(){

  if(!currentCustomer){

    return;
  }


  const button =
    document.getElementById("collectButton");

  const message =
    document.getElementById("visitMessage");


  button.disabled = true;

  button.textContent =
    "Checking...";

  message.textContent = "";


  const { data, error } =
    await supabaseClient.rpc(
      "collect_visit",
      {
        p_mobile:currentCustomer.mobile
      }
    );


  if(error){

    console.error(error);

    message.textContent =
      "Something went wrong. Please try again.";

    button.disabled = false;

    button.textContent =
      "COLLECT VISIT";

    return;
  }


  message.textContent =
    data.message;


  if(data.success){

    currentCustomer.stamps =
      data.stamps;

    currentCustomer.reward_ready =
      data.reward_ready;


    currentCustomer.last_visit_at =
      new Date().toISOString();


    localStorage.setItem(
      "luxury_customer",
      JSON.stringify(currentCustomer)
    );


    updateCard();

  }


  button.disabled = false;

  button.textContent =
    "COLLECT VISIT";

}


/* LOGOUT */

function logout(){

  currentCustomer = null;

  localStorage.removeItem(
    "luxury_customer"
  );


  document
    .getElementById("homeScreen")
    .classList.add("hidden");


  document
    .getElementById("loginScreen")
    .classList.remove("hidden");


  document.getElementById("name").value = "";

  document.getElementById("mobile").value = "";

}


/* REMEMBER CUSTOMER */

window.addEventListener(
  "load",
  function(){

    const saved =
      localStorage.getItem(
        "luxury_customer"
      );


    if(saved){

      try{

        currentCustomer =
          JSON.parse(saved);

        showHome();

      }catch(e){

        localStorage.removeItem(
          "luxury_customer"
        );

      }

    }

  }
);

</script>

</body>
    </html>
